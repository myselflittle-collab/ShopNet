<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almirah Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D wardrobe canvas, scroll drives the camera; one story card + 3D section chips float above; 2D shop panel slides in on click. */
:root{
  --sky:#E8E3FF; --ink:#1B1446; --cobalt:#3A3BFF; --sun:#FFC93C; --pink:#FF5FA2; --mint:#2ED3A0;
  --paper:#FFFFFF; --paper-2:#F6F3FF; --muted:#5B5486; --line:#1B1446;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;outline:none}
#scroller{height:700vh}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* Top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.logo{pointer-events:auto;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px}
.top-actions{display:flex;gap:10px;pointer-events:auto}
.btn{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.pink{background:var(--pink);color:var(--paper)}
.bag-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-variant-numeric:tabular-nums}

/* Story card */
.story{position:fixed;z-index:10;left:max(32px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-44%);width:min(430px,38vw);
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);padding:24px 26px 22px;perspective:700px}
.eyebrow{margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.h3d{margin:0 0 12px;font-family:var(--display);font-weight:800;line-height:.95;letter-spacing:-.02em;font-size:clamp(36px,4.6vw,62px);color:var(--sun);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-wrap:balance;
  text-shadow:1px 1px 0 var(--ink),2px 2px 0 var(--ink),3px 3px 0 var(--ink),4px 4px 0 var(--ink),5px 5px 0 var(--pink),6px 6px 0 var(--pink),7px 7px 0 var(--pink)}
.story.hero .h3d{font-size:clamp(48px,7vw,104px)}
.story .body{margin:0;font-size:16px;line-height:1.5;max-width:42ch}
.story .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.story .cta:empty{display:none}
.story.swap>*{animation:popIn .55s cubic-bezier(.2,1.4,.4,1) both}
.story.swap>*:nth-child(2){animation-delay:.05s}
.story.swap>*:nth-child(3){animation-delay:.1s}
.story.swap>*:nth-child(4){animation-delay:.15s}
@keyframes popIn{from{opacity:.0;transform:rotateX(-70deg) translateY(18px);transform-origin:50% 100%}to{opacity:1;transform:none}}
.step-tag{position:absolute;top:-16px;right:20px;background:var(--mint);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}

/* Section dots */
.dots{position:fixed;z-index:15;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.dot{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;padding:2px;font-weight:700;font-size:12px}
.dot span{opacity:0;transform:translateX(6px);transition:.2s;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
.dot i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);transition:.2s}
.dot:hover span,.dot.on span{opacity:1;transform:none}
.dot.on i{background:var(--pink);transform:scale(1.25)}

.hint{position:fixed;z-index:9;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink);transition:opacity .3s}
.hint svg{width:14px;height:14px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
.progress{position:fixed;z-index:21;top:0;left:0;height:4px;width:100%;background:var(--pink);transform-origin:0 50%;transform:scaleX(0)}

/* 3D section chips */
#labels{position:fixed;inset:0;z-index:8;pointer-events:none}
.chip{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--ink);transition:background .15s,opacity .25s;will-change:transform}
.chip small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{display:none}
.chip.hot{background:var(--sun)}
.chip.hot b{display:inline}
.chip.off{opacity:0;pointer-events:none}

/* 2D shop panel */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(27,20,70,.45);opacity:0;transition:opacity .3s}
.backdrop.open{opacity:1}
.panel{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(960px,100%);background:var(--paper-2);border-left:3px solid var(--ink);display:flex;flex-direction:column;
  transform:translateX(104%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.panel.open{transform:none}
.p-head{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:3px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.p-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.p-row h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1}
.p-row .eyebrow{margin-bottom:6px}
.p-count{font-size:14px;color:var(--muted);margin-top:6px}
.close{flex:none;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--sun);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.close svg{width:18px;height:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;flex:1 1 320px;min-width:0}
.fchip{flex:none;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search,.sort{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 12px;font:inherit;font-size:14px;color:var(--ink)}
.search{flex:1 1 200px;min-width:0}
.p-body{flex:1;overflow-y:auto;padding:20px 24px calc(28px + env(safe-area-inset-bottom,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.thumb{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;border-bottom:2.5px solid var(--ink);position:relative}
.thumb svg{width:78%;height:78%}
.badge{position:absolute;top:10px;left:10px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.brand{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.meta h3{margin:0;font-size:15px;line-height:1.25;font-weight:700}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;font-variant-numeric:tabular-nums}
.price b{font-size:17px}
.price s{color:var(--muted);font-size:13px}
.price .off{color:#0B8A63;font-weight:700;font-size:13px}
.stock{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stock i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.stock.low i{background:#FF8A3D}
.stock.out i{background:#C0392B}
.sizes{display:flex;flex-wrap:wrap;gap:4px}
.sizes span{font-size:11px;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px}
.add{margin-top:auto;border:2.5px solid var(--ink);background:var(--sun);border-radius:12px;padding:8px;font-weight:700;font-size:14px}
.add:disabled{background:var(--paper-2);color:var(--muted);cursor:not-allowed}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
.nogl{position:fixed;inset:0;display:grid;place-items:center;z-index:1}

@media (max-width:760px){
  .story{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:none;width:auto;padding:18px 18px 16px;border-radius:22px;box-shadow:5px 5px 0 var(--ink)}
  .h3d{font-size:34px;margin-bottom:8px}
  .story.hero .h3d{font-size:50px}
  .story .body{font-size:14.5px}
  .dots{right:max(8px,env(safe-area-inset-right,0px));top:96px;transform:none;gap:8px}
  .dot span{display:none}
  .dot i{width:11px;height:11px}
  .hint{display:none}
  .chip{font-size:12px;padding:5px 10px}
  .chip small{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .p-head,.p-body{padding-left:16px}
  .btn{padding:8px 12px}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<canvas id="gl" aria-label="3D wardrobe store. Scroll to move through the wardrobe."></canvas>
<div class="progress" id="progress"></div>

<header class="topbar">
  <button class="logo" id="home" aria-label="Almirah, back to start">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="3" width="30" height="34" rx="6" fill="#3A3BFF" stroke="#1B1446" stroke-width="2.5"/><line x1="20" y1="3" x2="20" y2="37" stroke="#1B1446" stroke-width="2.5"/><circle cx="16" cy="20" r="2.4" fill="#FF5FA2"/><circle cx="24" cy="20" r="2.4" fill="#FF5FA2"/></svg>
    almirah
  </button>
  <div class="top-actions">
    <button class="btn primary" id="openAll"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Full catalogue</span></button>
    <button class="btn" id="bagBtn" aria-label="Bag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="bag-count" id="bagCount">0</span></button>
  </div>
</header>

<div id="labels"></div>

<section class="story hero" id="story" aria-live="polite">
  <span class="step-tag" id="stepTag">01 / 07</span>
  <p class="eyebrow" id="sEyebrow">The 3D wardrobe store</p>
  <h1 class="h3d" id="sTitle">ALMIRAH</h1>
  <p class="body" id="sBody">Your whole closet in one cupboard. Scroll to open the doors and shop it shelf by shelf.</p>
  <div class="cta" id="sCta"></div>
</section>

<nav class="dots" id="dots" aria-label="Wardrobe sections"></nav>
<div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>Scroll to open the doors</div>

<div id="scroller"></div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="p-head">
    <div class="p-row">
      <div>
        <p class="eyebrow" id="pEyebrow">Department</p>
        <h2 id="pTitle">Blazers</h2>
        <div class="p-count" id="pCount"></div>
      </div>
      <button class="close" id="pClose" aria-label="Close and go back to the wardrobe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="controls">
      <div class="chips" id="pChips" role="group" aria-label="Filter"></div>
      <input class="search" id="pSearch" type="search" placeholder="Search name or brand" aria-label="Search products">
      <select class="sort" id="pSort" aria-label="Sort">
        <option value="feat">Featured</option>
        <option value="lo">Price: low to high</option>
        <option value="hi">Price: high to low</option>
        <option value="stock">Most in stock</option>
      </select>
    </div>
  </div>
  <div class="p-body"><div class="grid" id="pGrid"></div></div>
</aside>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const dk=new THREE.Mesh(new THREE.CapsuleGeometry?new THREE.SphereGeometry(.12,20,16):new THREE.SphereGeometry(.12,20,16),mat('#FF5FA2'));dk.position.set(0,.58,1.36);dk.scale.set(2.2,1,1);drawer.add(dk);
box(5.5,.05,2.15,SHELF,0,.2,.05,drawer);
box(.06,.55,2.15,SHELF,-2.72,.45,.05,drawer);box(.06,.55,2.15,SHELF,2.72,.45,.05,drawer);box(5.5,.55,.06,SHELF,0,.45,-1.0,drawer);

/* interactive items */
const ITEMS=[],pickables=[];
function addItem(group,cat,popDir,labelOff,parent){
  (parent||wardrobe).add(group);
  const it={group,cat,step:cat.step,base:group.position.clone(),baseRot:group.rotation.clone(),pop:popDir,labelOff,hover:0,i:ITEMS.length};
  group.traverse(o=>{if(o.isMesh){o.userData.item=it;pickables.push(o)}});
  const chip=document.createElement('button');chip.className='chip off';chip.innerHTML=`${cat.short||cat.name} <small>${COUNT[cat.id]} styles</small><b>· Shop →</b>`;
  chip.setAttribute('aria-label',`Shop ${cat.name}, ${COUNT[cat.id]} styles`);
  chip.onclick=()=>openPanel({type:'cat',cat:cat.id});
  chip.onpointerenter=()=>chipHover=it;chip.onpointerleave=()=>{if(chipHover===it)chipHover=null};
  $('#labels').appendChild(chip);it.chip=chip;ITEMS.push(it);return it;
}
// hanging garments
['blazers','shirts','tees','kurtas','jeans'].forEach((id,i)=>{
  const c=CAT[id],g=new THREE.Group();g.position.set(-2.24+i*1.12,5.45,0);
  const hook=new THREE.Mesh(new THREE.TorusGeometry(.09,.018,8,20,Math.PI*1.4),mat('#C9D1E0',{metalness:.6,roughness:.3}));hook.rotation.z=-.3;g.add(hook);
  const stem=box(.03,.14,.03,mat('#C9D1E0',{metalness:.6,roughness:.3}),0,-.15,0,g);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.8,8),mat('#8C5A2B'));bar.rotation.z=Math.PI/2;bar.position.y=-.24;g.add(bar);
  const s=id==='jeans'?.7:.66,m=iconMesh(c.kind,s,.1,c.color);m.position.y=-.28-(id==='jeans'?.76:.7)*s;g.add(m);
  addItem(g,c,new THREE.Vector3(0,-.05,.55),new THREE.Vector3(0,-1.58,.3));
});
// watches on pedestals
function makeWatch(c){
  const g=new THREE.Group(),v=c.variant;
  const strapC=v==='classic'?'#7A4A2A':v==='luxury'?'#AEB8CA':shade(c.color,-.15);
  const caseC=v==='classic'?'#E6B450':v==='luxury'?'#D8DEE9':v==='smart'?'#1B1446':c.color;
  const met=(v==='classic'||v==='luxury')?{metalness:.7,roughness:.25}:{};
  const st1=rbox(.2,.3,.05,.06,strapC);st1.position.y=.33;g.add(st1);const st2=rbox(.2,.3,.05,.06,strapC);st2.position.y=-.33;g.add(st2);
  if(v==='smart'){const cs=rbox(.38,.44,.08,.1,caseC);g.add(cs);const sc=rbox(.3,.36,.02,.07,'#0D0A26');sc.position.z=.06;g.add(sc);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.09,.018,8,32),new THREE.MeshBasicMaterial({color:c.color}));ring.position.z=.085;g.add(ring);
    const ring2=new THREE.Mesh(new THREE.TorusGeometry(.05,.016,8,32),new THREE.MeshBasicMaterial({color:'#FF5FA2'}));ring2.position.z=.085;g.add(ring2);}
  else{const cs=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.09,40),mat(caseC,met));cs.rotation.x=Math.PI/2;g.add(cs);
    const face=new THREE.Mesh(new THREE.CylinderGeometry(.175,.175,.02,40),mat(v==='sport'?'#1B1446':'#FFFDF5'));face.rotation.x=Math.PI/2;face.position.z=.05;g.add(face);
    const hc=v==='sport'?'#FFFFFF':'#1B1446';const h1=box(.022,.13,.01,hc,0,.055,.065,g);const h2=box(.09,.02,.01,hc,.04,-.01,.065,g);h2.rotation.z=-.4;
    const cr=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.06,12),mat(caseC,met));cr.rotation.z=Math.PI/2;cr.position.x=.25;g.add(cr);}
  return g;
}
['w-classic','w-sport','w-smart','w-luxury'].forEach((id,i)=>{
  const c=CAT[id],x=-2.1+i*1.4;
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(.34,.4,.16,32),mat('#FF5FA2'));ped.position.set(x,5.88,.15);wardrobe.add(ped);
  const g=makeWatch(c);g.position.set(x,6.32,.25);g.rotation.x=-.12;g.scale.setScalar(.95);
  addItem(g,c,new THREE.Vector3(0,.02,.6),new THREE.Vector3(0,-.72,.3));
});
// shoes
['sneakers','running','formal','boots'].forEach((id,i)=>{
  const c=CAT[id],g=new THREE.Group();g.position.set(-2.05+i*1.37,1.15,.1);
  const s=.62,m=iconMesh(c.kind,s,.3,c.color);m.position.y=(c.kind==='boot'?.46:.4)*s;g.add(m);
  const sole=new THREE.Mesh(new THREE.BoxGeometry(1.0*s*1.0,.07,.34),mat(c.variant==='formal'||c.kind==='boot'?'#1B1446':'#FFFFFF'));sole.position.set(.02,.035,0);g.add(sole);
  addItem(g,c,new THREE.Vector3(0,.25,.55),new THREE.Vector3(0,.95,.3));
});
// drawer items (laid flat)
['briefs','boxers','bras','swim','socks','thermals'].forEach((id,i)=>{
  const c=CAT[id],g=new THREE.Group(),col=i%3,row=Math.floor(i/3);
  g.position.set(-1.8+col*1.8,.3,-.48+row*1.0);g.rotation.x=-Math.PI/2;
  const m=iconMesh(c.kind,.62,.07,c.color);g.add(m);

/* playful floaters */
const floaters=[];
[[new THREE.TorusGeometry(.6,.22,16,40),'#FF5FA2',-5.6,6.2,-1.5],[new THREE.SphereGeometry(.55,32,24),'#2ED3A0',5.8,2.2,-.5],[new THREE.ConeGeometry(.5,1,4),'#FFC93C',5.2,7.2,-2.5],[new THREE.IcosahedronGeometry(.55,0),'#7A5CFF',-5.8,1.6,1],[new THREE.TorusKnotGeometry(.32,.11,64,10),'#FF8A3D',4.4,4.6,2.5]]
.forEach(([geo,c,x,y,z],i)=>{const m=new THREE.Mesh(geo,mat(c,{roughness:.35}));m.position.set(x,y,z);scene.add(m);floaters.push({m,y,i})});

/* ---------- camera keyframes ---------- */
const KF=[
 {t:[0,3.7,0],d:[0,.06,1],w:13,h:9.4,door:0,drawer:0},
 {t:[0,3.6,0],d:[0,.1,1],w:8.2,h:8,door:1,drawer:0},
 {t:[0,4.05,0],d:[0,.04,1],w:5.9,h:3.4,door:1,drawer:0},
 {t:[0,6.25,0],d:[0,.08,1],w:5.7,h:1.55,door:1,drawer:0},
 {t:[0,1.5,0],d:[0,.16,1],w:5.6,h:1.35,door:1,drawer:0},
 {t:[0,.35,1.85],d:[0,1.35,.9],w:6,h:2.4,door:1,drawer:1},
 {t:[0,3.6,0],d:[.62,.2,1],w:10,h:9,door:1,drawer:.3}
];
let CAMS=[];
function fitCams(){
  const W=innerWidth,H=innerHeight,a=W/H,tanH=Math.tan(FOV*Math.PI/360);
  CAMS=KF.map(k=>{
    const dir=new THREE.Vector3(...k.d).normalize(),fwd=dir.clone().negate();
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
    const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
    const t=new THREE.Vector3(...k.t);let w=k.w,h=k.h;
    if(a>1.05&&W>760){t.addScaledVector(right,-w*.22);w*=1.5}
    else{t.addScaledVector(up,-h*.42);h*=2.0;w*=1.05}
    const dist=Math.max((w/2)/(tanH*a),(h/2)/tanH);
    return{pos:t.clone().addScaledVector(dir,dist),tgt:t,door:k.door,drawer:k.drawer};
  });
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitCams()}
addEventListener('resize',resize);resize();

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(9,9);
let hovered=null,chipHover=null,mouseIn=false,activeStep=0,pNow=0;
function allowed(it){const near=Math.abs(pNow-activeStep)<.32;if(!near)return false;return it.step===activeStep||((activeStep===1||activeStep===6)&&it.step!==5)}
function pickAt(x,y){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects(pickables,false);for(const h of hits){const it=h.object.userData.item;if(it&&allowed(it))return it}return null}
const cv=$('#gl');let mx=0,my=0;
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;mouseIn=true;mx=e.clientX;my=e.clientY});
cv.addEventListener('pointerleave',()=>{mouseIn=false;hovered=null});
cv.addEventListener('click',e=>{const it=pickAt(e.clientX,e.clientY);if(it)openPanel({type:'cat',cat:it.cat.id})});

/* ---------- loop ---------- */
const ss=x=>x*x*(3-2*x),tmp=new THREE.Vector3(),cp=new THREE.Vector3(),ct=new THREE.Vector3();
let pTarget=0;
function readScroll(){pTarget=Math.min(N-1,Math.max(0,scrollY/maxScroll()*(N-1)))}
addEventListener('scroll',readScroll,{passive:true});readScroll();pNow=pTarget;
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const t=clock.getElapsedTime();
  pNow+=reduce?(pTarget-pNow):(pTarget-pNow)*.085;
  if(Math.abs(pTarget-pNow)<1e-4)pNow=pTarget;
  $('#progress').style.transform=`scaleX(${pNow/(N-1)})`;
  const i=Math.min(N-2,Math.floor(pNow)),f=ss(pNow-i),A=CAMS[i],B=CAMS[i+1];
  cp.lerpVectors(A.pos,B.pos,f);ct.lerpVectors(A.tgt,B.tgt,f);
  if(!reduce){cp.x+=Math.sin(t*.4)*.06;cp.y+=Math.cos(t*.5)*.04}
  camera.position.copy(cp);camera.lookAt(ct);
  const door=A.door+(B.door-A.door)*f,dr=A.drawer+(B.drawer-A.drawer)*f;
  doors.forEach(d=>d.pivot.rotation.y=-d.side*door*1.95);
  drawer.position.z=dr*1.9;
  activeStep=Math.round(pNow);showStep(activeStep);
  hovered=chipHover||(mouseIn&&!panel.classList.contains('open')?pickAt(mx,my):null);
  cv.style.cursor=hovered?'pointer':'';
  const near=1-Math.min(1,Math.abs(pNow-activeStep)/.35);
  ITEMS.forEach(it=>{
    it.hover+=((it===hovered?1:0)-it.hover)*(reduce?1:.14);
    const h=it.hover,g=it.group;
    g.position.copy(it.base).addScaledVector(it.pop,h);
    g.scale.setScalar((it.step===3?.95:1)*(1+.16*h));
    if(it.step===2){g.rotation.z=(reduce?0:Math.sin(t*1.1+it.i)*.03)+Math.sin(t*4)*.05*h;g.rotation.y=Math.sin(t*2)*.2*h}
    else if(it.step===5){g.rotation.z=Math.sin(t*3)*.12*h}
    else{g.rotation.y=Math.sin(t*2.2)*.35*h}
    // chip
    const show=it.step===activeStep&&near>.05;
    it.chip.classList.toggle('off',!show);it.chip.classList.toggle('hot',it===hovered);
    if(show){g.getWorldPosition(tmp);tmp.add(it.labelOff);tmp.project(camera);
      const x=(tmp.x*.5+.5)*innerWidth,y=(-tmp.y*.5+.5)*innerHeight;
      it.chip.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;it.chip.style.opacity=near}else it.chip.style.opacity=0;
  });
  if(!reduce)floaters.forEach(o=>{o.m.position.y=o.y+Math.sin(t*.9+o.i)*.35;o.m.rotation.x=t*.3+o.i;o.m.rotation.y=t*.4});
  renderer.render(scene,camera);
}
frame();
})();
